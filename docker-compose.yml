name: personagraph

services:
  api:
    build:
      context: ./backend
      target: runtime
    environment:
      PERSONA_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_API_BASE_URL: ${CEREBRAS_API_BASE_URL:-https://api.cerebras.ai/v1}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-personagraph_chunks}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      VECTOR_CANDIDATE_LIMIT: ${VECTOR_CANDIDATE_LIMIT:-20}
      LEXICAL_CANDIDATE_LIMIT: ${LEXICAL_CANDIDATE_LIMIT:-20}
      VECTOR_TIMEOUT_SECONDS: ${VECTOR_TIMEOUT_SECONDS:-5}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - personagraph_data:/data
      - embedding_cache:/models
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  personagraph_data:
  qdrant_data:
  embedding_cache:
