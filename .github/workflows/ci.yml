name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API, vector retrieval, and Cerebras contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/test_store.py

  database-tests:
    name: PostgreSQL migrations and database checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personagraph_test
          POSTGRES_USER: personagraph
          POSTGRES_PASSWORD: personagraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personagraph -d personagraph_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql://personagraph:personagraph@127.0.0.1:5432/personagraph_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_store.py tests/test_postgres_integration.py

  frontend-tests:
    name: Frontend build, lint, and Playwright E2E checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  compose-validation:
    name: Docker Compose and container build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose specification
        run: docker compose config --quiet
      - name: Build backend test image
        run: docker build --target test -t personagraph-api-test ./backend
      - name: Run containerized backend test suite
        run: docker run --rm personagraph-api-test pytest -q --ignore=tests/test_postgres_integration.py

  required-checks:
    name: All required checks passed
    if: always()
    needs:
      - api-tests
      - database-tests
      - frontend-tests
      - compose-validation
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          DATABASE_RESULT: ${{ needs.database-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          COMPOSE_RESULT: ${{ needs.compose-validation.result }}
        run: |
          test "$API_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$COMPOSE_RESULT" = "success"
