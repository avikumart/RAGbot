name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API, vector retrieval, and Cerebras contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/test_store.py

  database-tests:
    name: SQLite database checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_store.py

  frontend-tests:
    name: Frontend build and rendering checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  required-checks:
    name: All required checks passed
    if: always()
    needs:
      - api-tests
      - database-tests
      - frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          DATABASE_RESULT: ${{ needs.database-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          test "$API_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
